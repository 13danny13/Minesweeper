<!DOCTYPE html>
<html lang="ru">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#087f73">
  <meta name="description" content="Минное поле — Сапёр с уровнями сложности, сохранением игры и рекордами.">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="manifest" href="manifest.json">
  <title>Минное поле</title>
  <style>
    body { margin: 0; background: #f4f6f3; color: #182d37; font-family: sans-serif; }
    #loading { min-height: 100vh; display: grid; place-content: center; text-align: center; }
    #loading img { margin: 0 auto 20px; }
  </style>
</head>
<body>
  <div id="loading" role="status">
    <img src="icon.svg" width="72" height="72" alt="">
    <p>Готовим минное поле…</p>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', () => document.getElementById('loading')?.remove());
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
